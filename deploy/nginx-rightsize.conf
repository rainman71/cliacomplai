# Rightsize CLIA Compliance — Nginx site (Phase A: IP/HTTP).
# Put at /etc/nginx/sites-available/rightsize, symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
# Adjust the php-fpm socket to your installed PHP (php8.4-fpm shown).

server {
    listen 80;
    server_name _;                         # serves on the bare server IP for now
    root /var/www/rightsize-compliance/public;

    index index.php;
    charset utf-8;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }   # hide dotfiles (.env, .git, etc.)

    client_max_body_size 20m;                       # generated form PDFs
}

# --- Phase B (domain cutover) ---------------------------------------------------
# When the domain + Let's Encrypt cert are ready, replace the block above with:
